<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Productos</title>
    <link rel="stylesheet" href="public/css/registro.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Registrar Producto</h1>
        <form id="formulario-producto">
            
            <label for="codigo_barras">Código de Barras:</label>
            <input type="text" id="codigo_barras" name="codigo_barras" required>

            <label for="nombre">Nombre del Producto</label>
            <input type="text" id="nombre" placeholder="Ej. Galletas de Chocolate" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" required>
                <option value="" disabled selected>Selecciona una categoría</option>
                <option value="Snacks">Snacks</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Lácteos">Lácteos</option>
                <option value="Higiene">Higiene</option>
            </select>

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" placeholder="Ej. 50" required>

            <label for="precio">Precio ($)</label>
            <input type="number" step="0.01" id="precio" placeholder="Ej. 15.50" required>

            <!-- Botón personalizado para cargar imagen -->
            <div class="file-container">
                <input type="file" id="imagen" accept="image/*" onchange="mostrarImagen(event)">
                <label for="imagen">Seleccionar Imagen</label>
                <p id="file-name">Ningún archivo seleccionado</p>
            </div>

            <!-- Vista previa de la imagen -->
            <img id="preview" alt="Vista previa del producto">

            <button type="submit">Registrar Producto</button>
        </form>
    </div>


    <script>
        function mostrarImagen(event) {
            const preview = document.getElementById('preview');
            const fileName = document.getElementById('file-name');
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                };
                reader.readAsDataURL(file);
                fileName.textContent = file.name;
            } else {
                preview.style.display = "none";
                fileName.textContent = "Ningún archivo seleccionado";
            }
        }
    </script>

</body>
</html>
